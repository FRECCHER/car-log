<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>社用車 乗降記録</title>
<style>
  :root{
    --ink:#1c2430;
    --paper:#f6f5f2;
    --card:#ffffff;
    --line:#e2e0da;
    --sub:#6b7280;
    --go:#2f6f4f;
    --go-deep:#234f38;
    --stop:#a33b3b;
    --stop-deep:#7c2c2c;
    --accent:#c99a3a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding-bottom:40px;
  }
  header{
    padding:28px 20px 18px;
    border-bottom:1px solid var(--line);
    background:var(--card);
  }
  header .eyebrow{
    font-size:11px;
    letter-spacing:.18em;
    color:var(--sub);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  header h1{
    margin:0;
    font-size:20px;
    font-weight:700;
    letter-spacing:.01em;
  }
  main{
    max-width:520px;
    margin:0 auto;
    padding:22px 16px;
  }
  .status-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:26px 20px 22px;
    text-align:center;
    margin-bottom:18px;
  }
  .status-label{
    font-size:12px;
    letter-spacing:.14em;
    color:var(--sub);
    text-transform:uppercase;
    margin-bottom:4px;
  }
  .status-value{
    font-size:15px;
    font-weight:600;
    margin-bottom:18px;
    min-height:20px;
  }
  .status-value.driving{ color:var(--stop-deep); }
  .status-value.idle{ color:var(--sub); }

  #tripBtn{
    width:172px;
    height:172px;
    border-radius:50%;
    border:none;
    font-size:22px;
    font-weight:700;
    color:#fff;
    cursor:pointer;
    letter-spacing:.04em;
    box-shadow:0 6px 18px rgba(0,0,0,.14);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  #tripBtn:active{ transform:scale(.96); box-shadow:0 3px 10px rgba(0,0,0,.14); }
  #tripBtn.go{ background:linear-gradient(160deg,var(--go),var(--go-deep)); }
  #tripBtn.stop{ background:linear-gradient(160deg,var(--stop),var(--stop-deep)); }

  .timer{
    margin-top:14px;
    font-size:13px;
    color:var(--sub);
    font-variant-numeric:tabular-nums;
  }

  .section-title{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin:26px 0 10px;
  }
  .section-title h2{
    font-size:14px;
    margin:0;
    letter-spacing:.04em;
  }
  .section-title span{
    font-size:12px;
    color:var(--sub);
  }

  .actions{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  .actions button{
    flex:1;
    padding:10px 8px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .actions button:active{ background:#eeece6; }
  .actions button.primary{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }

  table{
    width:100%;
    border-collapse:collapse;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    font-size:13px;
  }
  th,td{
    padding:9px 8px;
    text-align:left;
    border-bottom:1px solid var(--line);
  }
  th{
    font-size:11px;
    letter-spacing:.06em;
    color:var(--sub);
    text-transform:uppercase;
    font-weight:600;
    background:#faf9f6;
  }
  tr:last-child td{ border-bottom:none; }
  td.num{ text-align:right; font-variant-numeric:tabular-nums; }

  .empty{
    text-align:center;
    color:var(--sub);
    font-size:13px;
    padding:26px 10px;
    background:var(--card);
    border:1px dashed var(--line);
    border-radius:12px;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:999px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .toast.show{ opacity:1; }

  .del{
    background:none;
    border:none;
    color:var(--sub);
    cursor:pointer;
    font-size:13px;
    padding:2px 4px;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">ダイサク — 業務ツール</div>
  <h1>社用車 乗降記録</h1>
</header>

<main>
  <div class="status-card">
    <div class="status-label">状態</div>
    <div class="status-value idle" id="statusText">読み込み中…</div>
    <button id="tripBtn" class="go">出発</button>
    <div class="timer" id="timer"></div>
  </div>

  <div class="section-title">
    <h2>記録一覧</h2>
    <span id="countLabel"></span>
  </div>

  <div class="actions">
    <button class="primary" id="csvBtn">CSVダウンロード</button>
    <button id="copyBtn">表をコピー</button>
  </div>

  <div id="listWrap"></div>
</main>

<div class="toast" id="toast"></div>

<script>
const CUR_KEY = 'car-log-current';
const REC_KEY = 'car-log-records';

let current = null;   // { start: isoString }
let records = [];     // [{id,startISO,endISO}]
let timerHandle = null;

const btn = document.getElementById('tripBtn');
const statusText = document.getElementById('statusText');
const timerEl = document.getElementById('timer');
const listWrap = document.getElementById('listWrap');
const countLabel = document.getElementById('countLabel');
const toastEl = document.getElementById('toast');

function pad(n){ return String(n).padStart(2,'0'); }

function fmtDate(iso){
  const d = new Date(iso);
  return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`;
}
function fmtTime(iso){
  const d = new Date(iso);
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function fmtDuration(startISO, endISO){
  const ms = new Date(endISO) - new Date(startISO);
  const totalSec = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  if(h>0) return `${h}時間${pad(m)}分`;
  if(m>0) return `${m}分${pad(s)}秒`;
  return `${s}秒`;
}
function durationMinutes(startISO, endISO){
  return Math.round((new Date(endISO)-new Date(startISO))/60000);
}

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=> toastEl.classList.remove('show'), 1600);
}

function loadState(){
  try{
    const c = localStorage.getItem(CUR_KEY);
    current = c ? JSON.parse(c) : null;
  }catch(e){ current = null; }
  try{
    const r = localStorage.getItem(REC_KEY);
    records = r ? JSON.parse(r) : [];
  }catch(e){ records = []; }
  render();
}

function saveCurrent(){
  try{
    if(current) localStorage.setItem(CUR_KEY, JSON.stringify(current));
    else localStorage.removeItem(CUR_KEY);
  }catch(e){ showToast('保存に失敗しました'); }
}
function saveRecords(){
  try{
    localStorage.setItem(REC_KEY, JSON.stringify(records));
  }catch(e){ showToast('保存に失敗しました'); }
}

function render(){
  if(current){
    btn.textContent = '帰社';
    btn.classList.remove('go');
    btn.classList.add('stop');
    statusText.textContent = `運転中（${fmtDate(current.start)} ${fmtTime(current.start)} 出発）`;
    statusText.classList.remove('idle');
    statusText.classList.add('driving');
    startTimer();
  } else {
    btn.textContent = '出発';
    btn.classList.remove('stop');
    btn.classList.add('go');
    statusText.textContent = '待機中';
    statusText.classList.remove('driving');
    statusText.classList.add('idle');
    stopTimer();
    timerEl.textContent = '';
  }
  renderList();
}

function startTimer(){
  stopTimer();
  const tick = () => {
    const sec = Math.floor((Date.now() - new Date(current.start))/1000);
    const h = pad(Math.floor(sec/3600));
    const m = pad(Math.floor((sec%3600)/60));
    const s = pad(sec%60);
    timerEl.textContent = `経過 ${h}:${m}:${s}`;
  };
  tick();
  timerHandle = setInterval(tick, 1000);
}
function stopTimer(){
  if(timerHandle){ clearInterval(timerHandle); timerHandle = null; }
}

function renderList(){
  countLabel.textContent = records.length ? `${records.length}件` : '';
  if(records.length === 0){
    listWrap.innerHTML = `<div class="empty">まだ記録がありません。「出発」を押すと記録が始まります。</div>`;
    return;
  }
  const rows = [...records].reverse().map(r => `
    <tr>
      <td>${fmtDate(r.startISO)}</td>
      <td>${fmtTime(r.startISO)}</td>
      <td>${fmtTime(r.endISO)}</td>
      <td class="num">${fmtDuration(r.startISO, r.endISO)}</td>
      <td><button class="del" data-id="${r.id}">削除</button></td>
    </tr>
  `).join('');
  listWrap.innerHTML = `
    <table>
      <thead>
        <tr><th>日付</th><th>出発</th><th>帰社</th><th>時間</th><th></th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
  listWrap.querySelectorAll('.del').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const id = b.getAttribute('data-id');
      records = records.filter(r => r.id !== id);
      await saveRecords();
      renderList();
      showToast('削除しました');
    });
  });
}

btn.addEventListener('click', async ()=>{
  if(!current){
    current = { start: new Date().toISOString() };
    await saveCurrent();
    render();
    showToast('出発を記録しました');
  } else {
    const rec = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
      startISO: current.start,
      endISO: new Date().toISOString()
    };
    records.push(rec);
    current = null;
    await saveCurrent();
    await saveRecords();
    render();
    showToast('帰社を記録しました');
  }
});

document.getElementById('csvBtn').addEventListener('click', ()=>{
  if(records.length === 0){ showToast('記録がありません'); return; }
  const header = ['日付','出発時刻','帰社時刻','走行時間(分)'];
  const lines = [header.join(',')];
  [...records].sort((a,b)=> new Date(a.startISO)-new Date(b.startISO)).forEach(r=>{
    lines.push([
      fmtDate(r.startISO),
      fmtTime(r.startISO),
      fmtTime(r.endISO),
      durationMinutes(r.startISO, r.endISO)
    ].join(','));
  });
  const csv = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `社用車記録_${fmtDate(new Date().toISOString()).replace(/\//g,'')}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('CSVをダウンロードしました');
});

document.getElementById('copyBtn').addEventListener('click', async ()=>{
  if(records.length === 0){ showToast('記録がありません'); return; }
  const header = ['日付','出発時刻','帰社時刻','走行時間(分)'];
  const lines = [header.join('\t')];
  [...records].sort((a,b)=> new Date(a.startISO)-new Date(b.startISO)).forEach(r=>{
    lines.push([
      fmtDate(r.startISO),
      fmtTime(r.startISO),
      fmtTime(r.endISO),
      durationMinutes(r.startISO, r.endISO)
    ].join('\t'));
  });
  const text = lines.join('\n');
  try{
    await navigator.clipboard.writeText(text);
    showToast('コピーしました（Excelに貼り付け可）');
  }catch(e){
    showToast('コピーに失敗しました');
  }
});

loadState();
</script>
</body>
</html>
